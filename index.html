<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Geografis - Kab. Landak (Supabase Storage)</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Tailwind CSS untuk Desain Modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        #map { height: 100vh; width: 100%; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-slate-100 flex h-screen overflow-hidden">

    <!-- Sidebar Formulir & Informasi -->
    <div class="w-full md:w-[450px] bg-white shadow-2xl flex flex-col z-10 h-full">
        <!-- Header -->
        <div class="p-5 bg-emerald-700 text-white flex items-center space-x-3 shadow-md">
            <img src="Logo Kabupaten Landak.png" alt="Logo" class="w-10 h-10 object-contain bg-white rounded-full p-1" onerror="this.style.display='none'">
            <div>
                <h1 class="font-bold text-lg leading-tight">SIG Jalan Usaha Tani</h1>
                <p class="text-xs text-emerald-100">Kabupaten Landak</p>
            </div>
        </div>

        <!-- Form Container -->
        <div class="p-6 overflow-y-auto flex-1 space-y-4">
            <div class="bg-emerald-50 border-l-4 border-emerald-600 p-3 text-xs text-emerald-800">
                <span class="font-bold">Petunjuk:</span> Klik pada peta untuk menentukan lokasi titik awal atau jalur Jalan Usaha Tani, lalu lengkapi data di bawah ini.
            </div>

            <form id="gisForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Kelompok Tani (Poktan)</label>
                    <input type="text" id="namaPoktan" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="Contoh: Tani Makmur">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">NIK Ketua</label>
                    <input type="text" id="nik" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="Nomor Induk Kependudukan">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    Latitude & Longitude otomatis terisi saat peta diklik
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Latitude</label>
                        <input type="text" id="lat" readonly required class="w-full px-3 py-2 bg-gray-50 border rounded-lg text-sm text-gray-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Longitude</label>
                        <input type="text" id="lng" readonly required class="w-full px-3 py-2 bg-gray-50 border rounded-lg text-sm text-gray-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Panjang Jalan (Meter)</label>
                    <input type="text" id="panjangJalan" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="Contoh: 500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Foto Kondisi Sawah</label>
                    <input type="file" id="fotoSawah" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Foto Kondisi Jalan</label>
                    <input type="file" id="fotoJalan" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-md">
                    Kirim Pengajuan
                </button>
            </form>
        </div>
    </div>

    <!-- Peta Utama -->
    <div id="map" class="flex-1"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // Konfigurasi Kredensial Supabase
        const SUPABASE_URL = 'https://gspoeftzhmbppyiqyvsf.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_5s9AIjHKo7yld0Mu1e0K_g_9W8SPwvr';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Inisialisasi Peta (Pusat Kabupaten Landak)
        const map = L.map('map').setView([0.3895, 109.9572], 11);

        // Layer Peta Dasar OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let marker;

        // Event Klik pada Peta untuk Ambil Koordinat
        map.on('click', function(e) {
            const lat = e.latlng.lat.toFixed(6);
            const lng = e.latlng.lng.toFixed(6);

            document.getElementById('lat').value = lat;
            document.getElementById('lng').value = lng;

            if (marker) {
                marker.setLatLng(e.latlng);
            } else {
                marker = L.marker(e.latlng).addTo(map);
            }
            marker.bindPopup(`<b>Titik Lokasi Terpilih</b><br>Lat: ${lat}<br>Lng: ${lng}`).openPopup();
        });

        // Fungsi Upload File ke Supabase Storage
        async function uploadToStorage(fileInputId, folderName) {
            const fileInput = document.getElementById(fileInputId);
            if (!fileInput.files || fileInput.files.length === 0) return null;

            const file = fileInput.files[0];
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36.substring(2, 9))}.${fileExt}`;
            const filePath = `${fileName}`;

            // Upload ke bucket 'foto_pengajuan'
            const { data, error } = await supabaseClient.storage
                .from('foto_pengajuan')
                .upload(filePath, file);

            if (error) {
                console.error('Gagal upload gambar:', error.message);
                alert('Gagal mengunggah foto: ' + error.message);
                return null;
            }

            // Ambil Public URL dari file yang di-upload
            const { data: publicUrlData } = supabaseClient.storage
                .from('foto_pengajuan')
                .getPublicUrl(filePath);

            return publicUrlData.publicUrl;
        }

        // Handle Submit Form
        document.getElementById('gisForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Mengunggah & Menyimpan...';

            try {
                // 1. Upload foto sawah & jalan ke Supabase Storage
                const fotoSawahUrl = await uploadToStorage('fotoSawah', 'sawah');
                const fotoJalanUrl = await uploadToStorage('fotoJalan', 'jalan');

                // 2. Kumpulkan data form
                const formData = {
                    nama_poktan: document.getElementById('namaPoktan').value,
                    nik: document.getElementById('nik').value,
                    latitude: parseFloat(document.getElementById('lat').value),
                    longitude: parseFloat(document.getElementById('lng').value),
                    panjang_jalan: document.getElementById('panjangJalan').value,
                    foto_sawah: fotoSawahUrl,
                    foto_jalan: fotoJalanUrl
                };

                // 3. Simpan ke Database Tabel 'pengajuan_poktan'
                const { error } = await supabaseClient
                    .from('pengajuan_poktan')
                    .insert([formData]);

                if (error) throw error;

                alert('Data dan Foto berhasil dikirim serta tersimpan di Supabase!');
                document.getElementById('gisForm').reset();
                if (marker) {
                    map.removeLayer(marker);
                    marker = null;
                }
            } catch (err) {
                console.error(err);
                alert('Terjadi kesalahan saat menyimpan data: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Kirim Pengajuan';
            }
        });
    </script>
</body>
</html>
